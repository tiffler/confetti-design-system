<!--
  Self-hosted webfonts, served from public/fonts via Storybook's staticDirs.

  No third-party request: visual regression testing cannot depend on the network, and
  the previous Google Fonts link meant a capture landing before the font arrived would
  produce a phantom diff with no code change behind it.
-->
<link rel="preload" href="/fonts/fredoka-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/fonts/fonts.css" />

<!--
  Hand Storybook's docs chrome to the tokens.

  global.css themes <body>, but the docs wrapper paints its own white background on top of
  it and sets its own ink on headings and prose. In dark mode that left the page white with
  cream specimen labels on it — illegible, and the opposite of the point: a Foundations page
  should show the system on the surface it actually ships on. These rules are Storybook-only
  (this file is injected into the preview iframe), so nothing here reaches consumers.
-->
<style>
  .sbdocs.sbdocs-wrapper {
    background: var(--color-surface-page);
    color: var(--color-text-primary);
  }

  /* The story preview block is a canvas, which is exactly the `raised` role. */
  .sbdocs .sb-previewBlock,
  .sbdocs .sbdocs-preview,
  .sbdocs .docs-story {
    background: var(--color-surface-raised);
  }

  /* Storybook sets explicit colors here, so they have to be repointed rather than inherited. */
  .sbdocs-content :is(h1, h2, h3, h4, h5, h6, p, li, td, th, strong, blockquote) {
    color: var(--color-text-primary);
  }

  .sbdocs-content :is(hr, table, th, td) {
    border-color: var(--color-border-subtle);
  }

  /* Inline `code` in prose. Storybook styles this as
     `.css-xxx :where(p:not(…)) code` — `:where()` contributes no specificity, so that rule
     computes to (0,1,1), an exact tie with a plain `.sbdocs-content code`. Emotion injects
     at runtime, i.e. after this file, so the tie always went to Storybook and the chip
     stayed near-white in dark mode. Hence `!important`, same as the code block below. */
  .sbdocs-content code {
    background: var(--code-inline-bg) !important;
    color: var(--code-inline-fg) !important;
    border: var(--code-inline-border-width) solid var(--code-inline-border-color) !important;
    border-radius: var(--code-inline-radius) !important;
    padding: var(--code-inline-padding-y) var(--code-inline-padding-x) !important;
  }

  /* …but not inside a block, which owns its own ground and syntax colors. Placed after the
     rule above so it wins on order as well as specificity. */
  .sbdocs-content pre code,
  pre.prismjs code {
    background: transparent !important;
    color: inherit !important;
    border: 0 !important;
    padding: 0 !important;
  }

  /* The props table renders OUTSIDE .sbdocs-content, so the rules above never reach it. It
     hardcodes a white cell background and a dark ink on the description column, which on a
     dark page left pale text on white. Both table class names are covered because Storybook
     renders the block wrapper and the table itself under different ones. Nested `div`s carry
     the hardcoded color; `span`s are left alone so the red required marker keeps its meaning. */
  :is(.sb-argstableBlock, .docblock-argstable) :is(th, td) {
    background: var(--color-surface-raised) !important;
    color: var(--color-text-primary) !important;
    border-color: var(--color-border-subtle) !important;
  }

  :is(.sb-argstableBlock, .docblock-argstable) :is(th, td) :is(div, p) {
    color: inherit !important;
  }

  /* The type pills ("boolean", "() => void") are spans with a hardcoded dark ink on a
     near-transparent chip, so they vanished on a dark row. Spans are reset everywhere
     EXCEPT the first column, which is where the red "required" asterisk lives — that one
     keeps its color because it is carrying meaning, not just theme. */
  :is(.sb-argstableBlock, .docblock-argstable) :is(th, td):not(:first-child) span {
    color: inherit !important;
  }

  /* The story preview's own toolbar (zoom / reset). It is the first child of the preview
     block and carries only a hashed Emotion class, so it has to be reached structurally. */
  .sbdocs.sbdocs-preview > *:first-child {
    background: var(--color-surface-panel) !important;
    border-color: var(--color-border-subtle) !important;
  }

  .sbdocs.sbdocs-preview > *:first-child :is(button, svg, a) {
    color: var(--color-text-muted) !important;
  }

  /* A drop-shadow tuned for a white table reads as a smudge on a dark one. */
  .docblock-argstable-body {
    filter: none;
  }

  /* ---- Code blocks -------------------------------------------------------------
     Storybook ships a dark-theme Prism palette (near-white punctuation) but renders it
     on a transparent block, so snippets were pale text on a pale page. The block is now
     an inset terminal on --code-bg, which is deep in BOTH modes so a single syntax
     palette reads against it. Colors come from tokens/component/portfolio/code.json,
     which reuses each theme's four accent hues — every one clears AA on its own ground.

     `!important` throughout is deliberate. Storybook ships its Prism palette as Emotion
     styles injected at runtime, i.e. AFTER this stylesheet and at the same specificity, so
     a plain rule always loses the tie. This is the sanctioned escape hatch for overriding
     third-party chrome, and it only reaches Storybook's own docs markup.                  */
  pre.prismjs,
  .docblock-source {
    background: var(--code-bg) !important;
    color: var(--code-fg) !important;
    border: 0 !important;
    border-radius: var(--code-radius) !important;
    padding: var(--code-padding) !important;
    font-family: var(--code-font-family) !important;
    font-size: var(--code-font-size) !important;
    line-height: var(--code-leading) !important;
  }

  /* The inline-code rule above would otherwise repaint every <code> inside the block. */
  pre.prismjs :is(code, span) {
    background: transparent !important;
  }

  pre.prismjs :is(.token.comment, .token.prolog, .token.doctype, .token.cdata) {
    color: var(--code-muted) !important;
    font-style: italic;
  }

  pre.prismjs :is(.token.punctuation, .token.operator) {
    color: var(--code-muted) !important;
  }

  pre.prismjs :is(.token.keyword, .token.boolean, .token.constant, .token.atrule, .token.important, .token.rule) {
    color: var(--code-keyword) !important;
  }

  pre.prismjs :is(.token.string, .token.char, .token.attr-value, .token.regex, .token.inserted) {
    color: var(--code-string) !important;
  }

  pre.prismjs :is(.token.number, .token.unit, .token.symbol) {
    color: var(--code-number) !important;
  }

  pre.prismjs :is(.token.function, .token.class-name, .token.tag, .token.selector, .token.builtin) {
    color: var(--code-function) !important;
  }

  pre.prismjs :is(.token.property, .token.literal-property, .token.attr-name, .token.variable, .token.parameter) {
    color: var(--code-fg) !important;
  }
</style>
